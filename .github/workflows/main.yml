name: Build Mod

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unpack project zip
        run: |
          if [ ! -f build.gradle ]; then
            Z=$(ls aetherium*.zip 2>/dev/null | head -n1 || true)
            if [ -z "$Z" ]; then echo "Нет build.gradle и нет zip проекта"; ls -la; exit 1; fi
            unzip -o -q "$Z" -x '.github/*'
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.1.1

      - name: Ensure Gradle wrapper
        run: |
          if [ ! -f gradlew ]; then
            gradle wrapper --gradle-version 8.1.1
          fi
          chmod +x gradlew

      - name: Unpack bundled resources
        run: unzip -n -q resources_bundle.zip -d src/main/resources

      - name: Build with Gradle
        run: ./gradlew build --no-daemon

      - name: Upload JAR as artifact
        uses: actions/upload-artifact@v4
        with:
          name: AetheriumOverlord-jar
          path: build/libs/*.jar
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Aetherium Overlord build ${{ github.run_number }}
          files: build/libs/*.jar
          prerelease: false

                - name: Распаковка ресурсов
        run: |
          mkdir -p src/main/resources
          unzip -n -q resources_bundle.zip -d src/main/resources

